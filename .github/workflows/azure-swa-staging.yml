name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durability-staging
  cancel-in-progress: true

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.stafinthelab.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test client and API
        run: |
          npm ci
          npm test
          cd api
          npm ci
          npm run build
          npm test

      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build staging bundle
        env:
          VITE_DEPLOY_ENV: staging
          VITE_STAGING_DEFAULT_HOST: black-forest-0d267be1e.5.azurestaticapps.net
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy isolated staging app
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: upload
          app_location: dist
          api_location: api
          config_file_location: .
          skip_app_build: true

      - name: Smoke test staging origin
        env:
          PLAYWRIGHT_BASE_URL: https://staging.stafinthelab.com
          STAGING_SMOKE: '1'
        run: npx playwright test e2e/staging-smoke.spec.ts
